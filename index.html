    <script>
      // Prevent Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return originalFetch; },
          set: function(val) { console.warn('Ignored attempt to overwrite window.fetch'); },
          configurable: true
        });
      } catch (e) {}
    </script>
